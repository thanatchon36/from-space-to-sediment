[project]
name = "from-space-to-sediment"
version = "2.0.0"
description = "Screening e-waste sites in Thailand from satellite data and attributing river contamination to upstream sources"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.5",
    "pyogrio>=0.7",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
hub = ["huggingface_hub>=0.24"]

[project.scripts]
fs2s = "from_space_to_sediment.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/from_space_to_sediment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
